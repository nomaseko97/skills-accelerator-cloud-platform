name: Skills Accelerator CI/CD
on:
 push:
   branches:
     - main
permissions:
 contents: read
 id-token: write
jobs:
 build-and-deploy:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout repository
       uses: actions/checkout@v4
     - name: Log in to Docker Hub
       uses: docker/login-action@v3
       with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}
     - name: Build Docker image
       run: |
         docker build \
           -t ${{ secrets.DOCKERHUB_USERNAME }}/skills-accelerator:latest .
     - name: Push Docker image
       run: |
         docker push \
           ${{ secrets.DOCKERHUB_USERNAME }}/skills-accelerator:latest
     - name: Configure AWS credentials
       uses: aws-actions/configure-aws-credentials@v6.2.3
       with:
         role-to-assume: arn:aws:iam::680666326125:role/GitHubActions-SkillsAccelerator-DeployRole
         aws-region: af-south-1
     - name: Deploy latest image to EC2
       run: |
         cat > ssm-command.json <<'EOF'
         {
           "DocumentName": "AWS-RunShellScript",
           "Comment": "Deploy latest Skills Accelerator image",
           "Targets": [
             {
               "Key": "tag:Name",
               "Values": ["skills-accelerator-app-instance"]
             }
           ],
           "Parameters": {
             "commands": [
               "set -e",
               "sudo docker pull nomaseko97/skills-accelerator:latest",
               "if sudo docker ps -a --format '{{.Names}}' | grep -qx 'skills-accelerator'; then sudo docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' skills-accelerator | sudo tee /tmp/skills-accelerator.env >/dev/null; sudo docker rm -f skills-accelerator; fi",
               "if [ -f /tmp/skills-accelerator.env ]; then sudo docker run -d --name skills-accelerator --restart unless-stopped --env-file /tmp/skills-accelerator.env -p 3000:3000 nomaseko97/skills-accelerator:latest; else sudo docker run -d --name skills-accelerator --restart unless-stopped -p 3000:3000 nomaseko97/skills-accelerator:latest; fi",
               "sudo docker ps --filter name=skills-accelerator"
             ]
           }
         }
         EOF
         COMMAND_ID=$(aws ssm send-command \
           --cli-input-json file://ssm-command.json \
           --query 'Command.CommandId' \
           --output text)
         echo "SSM Command ID: $COMMAND_ID"
         for i in {1..30}; do
           STATUS=$(aws ssm list-command-invocations \
             --command-id "$COMMAND_ID" \
             --details \
             --query 'CommandInvocations[0].Status' \
             --output text)
           echo "Deployment status: $STATUS"
           if [ "$STATUS" = "Success" ]; then
             echo "Deployment completed successfully."
             exit 0
           fi
           if [ "$STATUS" = "Failed" ] || \
              [ "$STATUS" = "Cancelled" ] || \
              [ "$STATUS" = "TimedOut" ]; then
             aws ssm list-command-invocations \
               --command-id "$COMMAND_ID" \
               --details
             exit 1
           fi
           sleep 10
         done
         echo "Deployment did not complete within expected time."
         exit 1