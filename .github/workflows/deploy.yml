name: Skills Accelerator CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/skills-accelerator:latest .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/skills-accelerator:latest

      - name: Deploy latest image to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "Pulling latest Docker image..."
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/skills-accelerator:latest

            echo "Checking for existing container..."

            if sudo docker ps -a --format '{{.Names}}' | grep -qx 'skills-accelerator'; then
              echo "Saving existing environment variables..."

              sudo docker inspect \
                -f '{{range .Config.Env}}{{println .}}{{end}}' \
                skills-accelerator \
                | sudo tee /tmp/skills-accelerator.env >/dev/null

              echo "Removing existing container..."
              sudo docker rm -f skills-accelerator
            fi

            echo "Starting latest application container..."

            if [ -f /tmp/skills-accelerator.env ]; then
              sudo docker run -d \
                --name skills-accelerator \
                --restart unless-stopped \
                --env-file /tmp/skills-accelerator.env \
                -p 3000:3000 \
                ${{ secrets.DOCKERHUB_USERNAME }}/skills-accelerator:latest
            else
              sudo docker run -d \
                --name skills-accelerator \
                --restart unless-stopped \
                -p 3000:3000 \
                ${{ secrets.DOCKERHUB_USERNAME }}/skills-accelerator:latest
            fi

            echo "Deployment complete."
            sudo docker ps --filter name=skills-accelerator
